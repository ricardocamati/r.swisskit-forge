<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioCut Pro - Corte de Áudios em Lote</title>
    <meta name="description" content="Ferramenta para cortar múltiplos arquivos de áudio em lote e exportar como MP3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== UPLOAD VIEW ===== -->
    <div id="uploadView" class="view active">
        <div class="upload-container">
            <div class="logo">
                <div class="logo-icon">✂️</div>
                <h1>AudioCut <span class="accent">Pro</span></h1>
                <p class="subtitle">Corte de áudios em lote — rápido e simples</p>
            </div>
            <div id="dropZone" class="drop-zone">
                <div class="drop-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <p class="drop-text">Arraste seus áudios aqui</p>
                <p class="drop-hint">ou clique para selecionar arquivos</p>
                <p class="drop-formats">MP3, WAV, OGG, FLAC, AAC, M4A</p>
                <input type="file" id="fileInput" multiple accept="audio/*" hidden>
            </div>
        </div>
    </div>

    <!-- ===== EDITOR VIEW ===== -->
    <div id="editorView" class="view">
        <header class="editor-header">
            <div class="header-left">
                <div class="header-logo">✂️</div>
                <h2>AudioCut <span class="accent">Pro</span></h2>
            </div>
            <div class="header-center">
                <span id="fileCounter" class="file-counter">Arquivo 1 de 5</span>
            </div>
            <div class="header-right">
                <button id="addMoreBtn" class="btn btn-ghost" title="Adicionar mais arquivos">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Adicionar
                </button>
                <input type="file" id="addFileInput" multiple accept="audio/*" hidden>
                <button id="exportBtn" class="btn btn-primary" title="Exportar todos como MP3">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Exportar Todos
                </button>
            </div>
        </header>

        <div class="editor-body">
            <!-- FILE LIST SIDEBAR -->
            <aside id="fileList" class="file-list">
                <div class="file-list-header">
                    <h3>Arquivos</h3>
                    <span id="fileListCount" class="badge">0</span>
                </div>
                <div id="fileListItems" class="file-list-items"></div>
            </aside>

            <!-- MAIN EDITOR -->
            <main class="editor-main">
                <div class="editor-card">
                    <!-- Current file name -->
                    <div class="current-file-info">
                        <span id="currentFileName" class="current-file-name">—</span>
                        <button id="resetSelectionBtn" class="btn btn-ghost btn-sm" title="Resetar seleção">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                            Resetar
                        </button>
                    </div>

                    <!-- Loading indicator -->
                    <div id="loadingIndicator" class="loading-indicator" style="display:none;">
                        <div class="spinner"></div>
                        <span>Decodificando áudio...</span>
                    </div>

                    <!-- Waveform -->
                    <div id="waveformContainer" class="waveform-container">
                        <canvas id="waveformCanvas"></canvas>
                    </div>

                    <!-- Time display -->
                    <div class="time-display">
                        <div class="time-block">
                            <label>Início</label>
                            <span id="startTimeDisplay" class="time-value start">0:00.0</span>
                        </div>
                        <div class="time-block center">
                            <label>Posição</label>
                            <span id="currentTimeDisplay" class="time-value">0:00.0</span>
                        </div>
                        <div class="time-block">
                            <label>Fim</label>
                            <span id="endTimeDisplay" class="time-value end">0:00.0</span>
                        </div>
                        <div class="time-block">
                            <label>Duração</label>
                            <span id="durationDisplay" class="time-value duration">0:00.0</span>
                        </div>
                    </div>

                    <!-- Playback controls -->
                    <div class="controls">
                        <div class="controls-left">
                            <button id="setStartBtn" class="btn btn-outline btn-sm" title="Definir início na posição atual (tecla [)">
                                Início ⟵
                            </button>
                        </div>
                        <div class="controls-center">
                            <button id="playSelectionBtn" class="btn btn-ghost btn-circle" title="Tocar seleção">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><polyline points="9 8 15 12 9 16"/></svg>
                            </button>
                            <button id="playPauseBtn" class="btn btn-primary btn-circle btn-lg" title="Play / Pause (Espaço)">
                                <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <svg id="pauseIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                            </button>
                            <button id="stopBtn" class="btn btn-ghost btn-circle" title="Parar">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
                            </button>
                        </div>
                        <div class="controls-right">
                            <button id="setEndBtn" class="btn btn-outline btn-sm" title="Definir fim na posição atual (tecla ])">
                                ⟶ Fim
                            </button>
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="navigation">
                        <button id="prevBtn" class="btn btn-ghost" title="Arquivo anterior">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                            Anterior
                        </button>
                        <button id="nextBtn" class="btn btn-accent" title="Próximo arquivo">
                            Próximo
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ===== EXPORT MODAL ===== -->
    <div id="exportModal" class="modal" style="display:none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <h3>Exportando Áudios</h3>
            <p id="exportStatus">Preparando...</p>
            <div class="progress-bar">
                <div id="exportProgress" class="progress-fill"></div>
            </div>
            <p id="exportDetail" class="export-detail"></p>
            <button id="exportCloseBtn" class="btn btn-primary" style="display:none;">Fechar</button>
        </div>
    </div>

    <!-- ===== NOTIFICATION ===== -->
    <div id="notification" class="notification"></div>

    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
